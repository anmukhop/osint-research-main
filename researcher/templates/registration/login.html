<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in · OSINT Research Tool</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #0f172a; color: #e2e8f0; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 360px; }
        h1 { color: #60a5fa; margin-bottom: 1rem; }
        label { display: block; margin-top: 0.75rem; font-size: 0.875rem; color: #94a3b8; }
        input { width: 100%; padding: 0.625rem; margin-top: 0.25rem; border: 1px solid #334155;
                border-radius: 6px; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; }
        button { margin-top: 1.25rem; width: 100%; padding: 0.75rem; background: #3b82f6;
                 color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #2563eb; }
        .password-field { position: relative; }
        button.password-toggle { position: absolute; top: 50%; right: 0.25rem; transform: translateY(-35%);
                                 width: 2.25rem; margin: 0; padding: 0;
                                 display: flex; align-items: center; justify-content: center;
                                 background: transparent; color: #94a3b8; }
        button.password-toggle:hover { background: #1e293b; color: #e2e8f0; }
        button.password-toggle:focus-visible { outline: 2px solid #60a5fa; outline-offset: 1px; }
        button.password-toggle svg { width: 1.2rem; height: 1.2rem; }
        .meta { margin-top: 1rem; font-size: 0.875rem; color: #94a3b8; text-align: center; }
        .meta a { color: #60a5fa; text-decoration: none; }
        .errorlist { list-style: none; padding: 0; color: #fecaca; font-size: 0.875rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Log in</h1>
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}{{ form.non_field_errors }}{% endif %}
            <label for="id_username">Username</label>
            {{ form.username }}
            <label for="id_password">Password</label>
            <div class="password-field">
                {{ form.password }}
                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <button type="submit">Log in</button>
        </form>
        <p class="meta">
            No account? <a href="{% url 'signup' %}">Sign up</a>
            <br>
            <a href="/">← Continue without logging in</a>
        </p>
    </div>
    <script>
        document.querySelectorAll(".password-toggle").forEach((toggle) => {
            toggle.addEventListener("click", () => {
                const password = toggle.parentElement.querySelector("input");
                const isVisible = password.type === "text";
                password.type = isVisible ? "password" : "text";
                toggle.setAttribute("aria-pressed", String(!isVisible));
                toggle.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
            });
        });
    </script>
</body>
</html>
