<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign up · OSINT Research Tool</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #0f172a; color: #e2e8f0; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 400px; }
        h1 { color: #60a5fa; margin-bottom: 1rem; }
        label { display: block; margin-top: 0.75rem; font-size: 0.875rem; color: #94a3b8; }
        input { width: 100%; padding: 0.625rem; margin-top: 0.25rem; border: 1px solid #334155;
                border-radius: 6px; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; }
        button { margin-top: 1.25rem; width: 100%; padding: 0.75rem; background: #3b82f6;
                 color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #2563eb; }
        .helptext, .errorlist { font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem;
                                list-style: none; padding: 0; }
        .errorlist { color: #fecaca; }
        .meta { margin-top: 1rem; font-size: 0.875rem; color: #94a3b8; text-align: center; }
        .meta a { color: #60a5fa; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sign up</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}<p class="helptext">{{ field.help_text|safe }}</p>{% endif %}
                {% if field.errors %}{{ field.errors }}{% endif %}
            {% endfor %}
            <button type="submit">Create account</button>
        </form>
        <p class="meta">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</body>
</html>
