<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create team · OSINT Research Tool</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #080c14; color: #e4e9f1; min-height: 100vh; padding: 2rem; margin: 0;
               display: flex; align-items: center; justify-content: center; }
        .card { background: #111927; border: 1px solid #1e2d4a; padding: 2rem;
                border-radius: 12px; width: 440px; }
        h1 { color: #6b93ff; margin-bottom: 0.25rem; }
        p.sub { color: #7a8baa; font-size: 0.9rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.875rem; color: #7a8baa; margin-bottom: 0.375rem; }
        input[type="text"] { width: 100%; padding: 0.75rem; border: 1px solid #1e2d4a;
                             border-radius: 6px; background: #080c14; color: #e4e9f1;
                             font-size: 0.95rem; font-family: inherit; }
        input[type="text"]:focus { outline: none; border-color: #3b6cf6; }
        button { margin-top: 1.25rem; width: 100%; padding: 0.75rem; background: #3b6cf6;
                 color: white; border: none; border-radius: 6px; font-size: 1rem;
                 cursor: pointer; font-family: inherit; font-weight: 500; }
        button:hover { background: #6b93ff; }
        .msg { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.875rem; }
        .msg.error { background: #2a1215; color: #fecaca; border: 1px solid #ef444433; }
        .back { display: inline-block; color: #7a8baa; text-decoration: none;
                font-size: 0.875rem; margin-bottom: 1rem; }
        .back:hover { color: #e4e9f1; }
    </style>
</head>
<body>
    <div class="card">
        <a class="back" href="{% url 'teams_list' %}">← My teams</a>
        <h1>Create team</h1>
        <p class="sub">You'll be the owner and can invite others with a code.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="msg {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="name">Team name</label>
            <input type="text" id="name" name="name" required maxlength="120" autofocus>
            <button type="submit">Create</button>
        </form>
    </div>
</body>
</html>
